# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=tempadtomapx
mod_name=Tempad to Map: Xaero's edition
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.tempadtomapx
mod_authors=KURONAMI
mod_description=Shows your Tempad teleport locations as Xaero's Minimap waypoints.

# ─── Dependencies ─────────────────────────────────────────────
# Tempad (compileOnly・resourcefulbees terrarium maven、pom で groupId/artifactId 確認済み・mod-075 実績値)
tempad_version=3.0.4
# Xaero's Minimap (localRuntime のみ・Reflection で呼ぶため compileOnly / 依存宣言は不要。
# Modrinth maven metadata から 1.21.1 neoforge 対応最新を選択・実在確認済み 2026-08-26)
xaeros_version=neoforge-1.21.1-26.4.2
